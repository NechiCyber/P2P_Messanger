<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- header -->
  <header>
    <h1 class="title_text">~ HTTP Server</h1>
  </header>

  <hr>

  <!-- main -->
  <main>
    
    <!-- with users -->
    <section class="user-management">
      <h2>👤 API Endpoint: <code>/users</code></h2>
      
      <!-- new user -->
      <div class="card create-user-box">
        <h3 class="data_text_main_page">Add New User</h3>
        <p>Enter a name or login in database:</p>
        
        <form id="createUserForm" onsubmit="event.preventDefault();">
          <input type="text" placeholder="e.g. John Doe" id="userInput" required>
          <button type="submit" class="btn-post">Send POST Request</button>
        </form>
      </div>

      <br>

      <!-- actual list of users -->
      <div class="card data-viewer-box">
        <p>Actual list of users:</p>
        
        <button class="listUs btn-get">Fetch List of Users (GET)</button>
      </div>

    </section>

    <br>
    <hr>

  </main>

  <!-- foote r-->
  <footer>
    <p><small>&copy; 2026 Nechi. All rights reserved. Built with Express.js</small></p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
